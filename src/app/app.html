<div class="calculator">

  <h1>Calculator</h1>

  <p class="subtitle">PRODUCTION VERSION - Addition Only (All Integers)</p>

  <div class="input-group">

    <label>First Number</label>

    <input
  type="number"
  [(ngModel)]="firstNumber"
  placeholder="Enter first number"
/>

  </div>


  <div class="input-group">

    <label>Second Number</label>

    <input
  type="number"
  [(ngModel)]="secondNumber"
  placeholder="Enter second number"
/>

  </div>


  <div class="operation">

    <button (click)="setOperation('+')">+</button>

    <button (click)="setOperation('-')" disabled>- (Not Available)</button>

  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

 <div class="action-buttons">

  <button class="calculate" (click)="calculate()">
    Calculate
  </button>

  <button class="reset" (click)="reset()">
    Reset
  </button>

</div>


  <div class="result">

    <p>Result</p>

    <h2>{{ result }}</h2>

  </div>

</div>
